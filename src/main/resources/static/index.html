<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>API Contatos</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 500px; margin: auto; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        li { margin: 5px 0; }
    </style>
</head>
<body>

    <h1>API Contatos</h1>

    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="email" id="email" placeholder="Email">
    <button onclick="adicionarContato()">Adicionar</button>

    <h3>Contatos</h3>
    <ul id="lista"></ul>

<script>
const API_URL = "https://api-contatos-fu37.onrender.com/contatos";

// Carrega os contatos quando abre a página
window.onload = listarContatos;

async function listarContatos() {
    try {
        const resposta = await fetch(API_URL);
        const contatos = await resposta.json();
        const lista = document.getElementById('lista');
        lista.innerHTML = '';
        contatos.forEach(c => {
            lista.innerHTML += `<li>${c.nome} - ${c.telefone} - ${c.email}</li>`;
        });
    } catch (erro) {
        console.error("Erro ao listar:", erro);
    }
}

async function adicionarContato() {
    const contato = {
        nome: document.getElementById('nome').value,
        telefone: document.getElementById('telefone').value,
        email: document.getElementById('email').value
    };

    try {
        const resposta = await fetch(API_URL, {
            method: 'POST',
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contato)
        });

        if(resposta.ok){
            alert('Contato adicionado com sucesso!');
            // Limpa os campos
            document.getElementById("nome").value = "";
            document.getElementById("telefone").value = "";
            document.getElementById("email").value = "";
            // Atualiza a lista
            listarContatos();
        } else {
            alert('Erro ao adicionar contato');
        }
    } catch (erro) {
        console.error("Erro ao adicionar:", erro);
        alert('Erro de conexão com a API');
    }
}
</script>

</body>
</html>
