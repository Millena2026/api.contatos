<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minha Agenda</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        h1 { color: #333; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #4CAF50; color: white; cursor: pointer; }
        button:hover { background: #45a049; }
        .contato { background: white; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>📒 Minha Agenda</h1>

    <h3>Adicionar Contato</h3>
    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="text" id="email" placeholder="Email">
    <button onclick="adicionarContato()">Adicionar</button>

    <h3>Contatos</h3>
    <div id="lista"></div>

    <script>
        const apiUrl = "http://localhost:8080/contatos";

        window.onload = listarContatos;

        function listarContatos() {
            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    let html = "";
                    data.forEach(c => {
                        html += `<div class="contato">
                            <b>${c.nome}</b><br>
                            📞 ${c.telefone}<br>
                            ✉️ ${c.email}
                        </div>`;
                    });
                    document.getElementById("lista").innerHTML = html;
                });
            }

        function adicionarContato() {
            const contato = {
                nome: document.getElementById("nome").value,
                telefone: document.getElementById("telefone").value,
                email: document.getElementById("email").value
            };

            fetch(apiUrl, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(contato)
            }).then(() => {
                document.getElementById("nome").value = "";
                document.getElementById("telefone").value = "";
                document.getElementById("email").value = "";
                listarContatos();
            });
        }
    </script>
</body>
</html>
